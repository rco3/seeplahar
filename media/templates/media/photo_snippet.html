{# media/photo_snippet.html #}
{% load permissions %}
<div class="photo-container relative" style="width:5rem;height:5rem;flex-shrink:0;border-radius:4px;overflow:hidden;">
    <img src="{{ photo.image.url }}"
         alt="{{ photo.description|default:'' }}"
         style="width:100%;height:100%;object-fit:cover;display:block;">
    {% if user|has_perm:'media.delete_photo' %}
        <button class="delete-photo"
                style="position:absolute;top:2px;right:2px;
                       background:rgba(0,0,0,0.6);color:white;border:none;
                       border-radius:3px;padding:1px 5px;cursor:pointer;font-size:0.7rem;"
                hx-delete="{% url 'media:delete_photo' photo.id %}"
                hx-target="#photos-{{ object_type|cut:'.' }}-{{ object_id }}"
                hx-swap="outerHTML">×</button>
    {% endif %}
</div>
