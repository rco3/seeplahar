{# media/photos_edit.html — photo management on edit pages (delete only, no upload) #}
{% load permissions %}

<div id="photos-edit-{{ object_type|cut:'.' }}-{{ object_id }}"
     hx-trigger="photoDeleted from:body"
     hx-get="{% url 'media:get_photos_edit' object_type=object_type object_id=object_id %}"
     hx-swap="outerHTML">

  {% if photos %}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">
      {% for photo in photos %}
        <div style="position:relative;width:80px;height:80px;border-radius:4px;overflow:hidden;flex-shrink:0;">
          <img src="{{ photo.image.url }}" alt=""
               style="width:100%;height:100%;object-fit:cover;display:block;">
          {% if user|has_perm:'media.delete_photo' %}
            <button style="position:absolute;top:2px;right:2px;
                           background:rgba(180,0,0,0.8);color:white;border:none;
                           border-radius:3px;padding:1px 5px;cursor:pointer;font-size:0.7rem;"
                    hx-delete="{% url 'media:delete_photo' photo.id %}"
                    hx-swap="none">×</button>
          {% endif %}
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p style="color:#9ca3af;font-style:italic;font-size:0.875rem;margin-top:4px;">
      No photos yet — add them from the detail page.
    </p>
  {% endif %}

</div>
