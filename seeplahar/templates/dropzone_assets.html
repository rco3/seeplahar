{% load static %}
<script>
(function () {
  'use strict';

  function getCsrfToken() {
    var m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }

  function uploadFile(heroEl, file) {
    if (!file || !file.type.startsWith('image/')) return;

    var loading = heroEl.querySelector('.upload-loading');
    if (loading) loading.style.display = 'flex';
    heroEl.style.pointerEvents = 'none';

    var formData = new FormData();
    formData.append('file', file);

    fetch(heroEl.dataset.uploadUrl, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCsrfToken() },
      body: formData
    }).then(function (resp) {
      if (!resp.ok) return resp.text().then(function (t) { throw new Error(t); });
      document.body.dispatchEvent(new Event('photoUploaded', { bubbles: true }));
    }).catch(function (err) {
      console.error('Photo upload failed:', err);
      if (loading) loading.style.display = 'none';
      heroEl.style.pointerEvents = '';
    });
  }

  // Drag over — prevent browser default (opening the file)
  document.addEventListener('dragover', function (e) {
    var hero = e.target.closest('[data-upload-url]');
    if (!hero) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    hero.style.outline = '2px solid #60a5fa';
  });

  document.addEventListener('dragenter', function (e) {
    var hero = e.target.closest('[data-upload-url]');
    if (hero) hero.style.outline = '2px solid #60a5fa';
  });

  document.addEventListener('dragleave', function (e) {
    var hero = e.target.closest('[data-upload-url]');
    if (hero && !hero.contains(e.relatedTarget)) {
      hero.style.outline = '';
    }
  });

  document.addEventListener('drop', function (e) {
    var hero = e.target.closest('[data-upload-url]');
    if (!hero) return;
    e.preventDefault();
    hero.style.outline = '';
    uploadFile(hero, e.dataTransfer.files[0]);
  });

  // Click to open file picker
  document.addEventListener('click', function (e) {
    if (e.target.type === 'file') return;          // avoid re-triggering
    if (e.target.closest('button, a')) return;     // don't intercept controls
    var hero = e.target.closest('[data-upload-url]');
    if (!hero) return;
    var input = hero.querySelector('input[type="file"]');
    if (input) input.click();
  });

  // File input selection
  document.addEventListener('change', function (e) {
    if (e.target.type !== 'file') return;
    var hero = e.target.closest('[data-upload-url]');
    if (!hero) return;
    uploadFile(hero, e.target.files[0]);
    e.target.value = '';
  });

})();
</script>
