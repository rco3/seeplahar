{% load static %}
<link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />
<script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
<script>
  // Disable auto-discovery immediately
  Dropzone.autoDiscover = false;
</script>
<script>
// Use an immediately executed function to avoid conflicts
(function() {
  // Wait for DOM to be fully loaded
  document.addEventListener('DOMContentLoaded', function() {
    function initializeDropzones(context) {
      context.querySelectorAll('.dropzone').forEach(function(el) {
        // Skip if already initialized
        if (el.dropzone) {
          console.log('Dropzone already initialized, skipping:', el);
          return;
        }
        
        // Get URL directly from attribute
        var uploadUrl = el.getAttribute('data-url');
        if (!uploadUrl) {
          console.error('Dropzone element missing data-url attribute:', el);
          return;
        }
        
        console.log('Initializing dropzone with URL:', uploadUrl);
        
        try {
          // Create new Dropzone with explicit URL
          new Dropzone(el, {
            url: uploadUrl,
            headers: {
              'X-CSRFToken': '{{ csrf_token }}'
            },
            dictDefaultMessage: "Drop files here or click to upload",
            success: function(file, response) {
              document.body.dispatchEvent(new Event('photoUploaded', {bubbles: true}));
              this.removeFile(file);
            },
            error: function(file, errorMessage) {
              console.error("Upload error:", errorMessage);
              this.removeFile(file);
            }
          });
        } catch (e) {
          console.error('Error initializing Dropzone:', e);
        }
      });
    }
    
    // Initialize on page load with slight delay to ensure DOM is ready
    setTimeout(function() {
      initializeDropzones(document);
    }, 100);
    
    // Reinitialize after htmx swaps
    document.addEventListener('htmx:afterSwap', function(event) {
      initializeDropzones(event.target);
    });
  });
})();
</script>
